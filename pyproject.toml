[project]
name = "access-profiling"
dynamic = ["version"]
description = "Tools to profile and optimise parallel applications, with implementations for the ACCESS climate models."
authors = [
  {name = "Micael Oliveira", email="micael.oliveira@anu.edu.au"},
  {name = "Manodeep Sinha", email="manodeep.sinha@anu.edu.au"},
  {name = "Edward Yang", email="edward.yang@anu.edu.au"},  
]
readme = "README.md"
keywords = ["profiling", "performance", "parallel", "hpc", "scaling", "access", "climate"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
requires-python = ">=3.11.4"
dependencies = [
    "xarray",
    "pint",
    "pint-xarray",
    "matplotlib",
    "access-config-utils>=0.4",
    "experiment-generator>=0.10.2",
    "experiment-runner>=0.3.2",
    "payu", # Extra dependency of experiment-runner, not handled correctly in conda
]

[project.urls]
Homepage = "https://github.com/ACCESS-NRI/access-profiling"
Documentation = "https://access-profiling.readthedocs.io/"
Repository = "https://github.com/ACCESS-NRI/access-profiling"
Issues = "https://github.com/ACCESS-NRI/access-profiling/issues"

[build-system]
requires = ["setuptools>=80", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
devel = [
    "pre-commit",
]
test = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
addopts = ["--cov=access.profiling", "--cov-report=term", "--cov-report=html", "--cov-report=xml"]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["setup.py"]

[tool.ruff]
line-length = 120
# Copied verbatim from the ACCESS-NRI documentation template, and kept that way so it can be updated from there
extend-exclude = ["documentation/hooks"]

[tool.ruff.lint]
select = ["E", "F", "B", "C4", "SIM", "PTH", "UP", "I", "N", "C901"]
