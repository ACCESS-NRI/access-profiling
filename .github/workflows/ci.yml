# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  PY_VERSION_BUILD: 3.12
  PIP_UPLOADED_PRIOR_TO: P7D

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PY_VERSION_BUILD }}
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  pypa-build:
    name: PyPA build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VERSION_BUILD }}
          cache: 'pip' # caching pip dependencies

      - run: |
          python3 -m pip install --upgrade build && python3 -m build

  conda-build:
    name: Conda Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup conda environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniconda-version: "latest"
          python-version: ${{ env.PY_VERSION_BUILD }}
          environment-file: conda/environment.yml
          auto-update-conda: false
          auto-activate-base: false
          show-channel-urls: true

      - name: Build conda package
        uses: ACCESS-NRI/action-build-and-upload-conda-packages@v3.1.0
        with:
          meta_yaml_dir: conda
          label: main
          upload: false

  build:
    needs: formatting
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --uploaded-prior-to=P0D access-config-utils
        pip install '.[devel,test]'
    - name: Test with pytest
      run: |
        python -m pytest
    - name: Upload coverage reports to Codecov with GitHub Action
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0  # the dates at the foot of every page are read from the git history
    - uses: actions/setup-python@v7
      with:
        python-version: '3.13'  # as in .readthedocs.yaml
        cache: 'pip'
        cache-dependency-path: documentation/requirements.txt
    - name: Install the documentation requirements
      run: python -m pip install -r documentation/requirements.txt
    # Strict, unlike the Read the Docs build, so that a docstring the API reference cannot read fails here
    - name: Build the documentation, with warnings as errors
      env:
        # Set by Read the Docs, and required by the resolve-absolute-urls plugin
        READTHEDOCS_CANONICAL_URL: https://access-profiling.access-hive.org.au/latest/
        NO_MKDOCS_2_WARNING: 'true'
      run: python -m mkdocs build --strict --config-file documentation/mkdocs.yml --site-dir "$RUNNER_TEMP/site"
