name: CD
on:
  push:
    tags:
      - 'v*'

env:
  PY_VERSION: 3.12
  PIP_UPLOADED_PRIOR_TO: P7D

jobs:
  pypi-build:
    name: Build package for PyPI
    if: github.repository == 'ACCESS-NRI/access-profiling'  # exclude forks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PY_VERSION }}

      - run: |
          python3 -m pip install --upgrade build && python3 -m build

      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist

  pypi-publish:
    # Split build and publish to restrict trusted publishing to just this workflow
    needs: ['pypi-build']
    name: Publish to PyPI.org
    runs-on: ubuntu-latest
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  conda:
    name: Build with conda and upload
    if: github.repository == 'ACCESS-NRI/access-profiling'  # exclude forks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup conda environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          miniconda-version: "latest"
          python-version: ${{ env.PY_VERSION }}
          environment-file: conda/environment.yml
          auto-update-conda: false
          auto-activate-base: false
          show-channel-urls: true

      - name: Build and upload conda package
        uses: ACCESS-NRI/action-build-and-upload-conda-packages@v3.1.0
        with:
          meta_yaml_dir: conda
          user: ${{ vars.ANACONDA_USER }}
          label: main
          token: ${{ secrets.ANACONDA_TOKEN }}

