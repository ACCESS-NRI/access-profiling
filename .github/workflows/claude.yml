# Answers an @claude mention in an issue, a pull request comment or a review, by someone with write access: a
# question, or a request to review a pull request or to propose a change. .github/scripts/claude_reply.py makes one
# request to the Claude Messages API and posts the reply; its module docstring says why it does not run Claude Code.
# Needs the repository secret ANTHROPIC_API_KEY.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

env:
  PIP_UPLOADED_PRIOR_TO: P7D

jobs:
  reply:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # The default branch, whatever the event: the script and the source it sends come from there, never from a
      # pull request, whose files it reads through the API instead.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the Anthropic SDK
        run: |
          python -m pip install --upgrade pip
          pip install anthropic

      - name: Reply
        run: python .github/scripts/claude_reply.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
